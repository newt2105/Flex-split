# Chỉ cần sửa file này để chạy các thí nghiệm Flex-split.

[experiments]
# Chạy từ trên xuống dưới. Thêm dấu # ở đầu dòng để bỏ một case.
cases =
    T1-R1-LC
    T1-R1-RC
    T1-R1-HC
    T1-F1-LC
    T1-F1-RC
    T1-F1-HC
    T2-R1-LC
    T2-R1-RC
    T2-R1-HC
    T2-F1-LC
    T2-F1-RC
    T2-F1-HC

# Số đường có độ trễ thấp nhất được xét cho mỗi vị trí RU.
k_paths = 10

# Trọng số hàm mục tiêu: 1.0 ưu tiên số DRC, 0.0 ưu tiên độ trễ.
beta = 0.5

# PuLP backend: cbc, gurobi hoặc auto.
solver = gurobi

# false = chỉ hiện tiến độ/tổng kết; true = hiện log solver và placement.
show_log = false

# Để trống nếu không giới hạn; nếu đặt thì tính bằng giây cho mỗi case.
time_limit =

# Dừng ngay nếu một case lỗi. false = ghi lỗi rồi chạy case tiếp theo.
stop_on_error = true

# Đường dẫn tương đối được tính từ thư mục FlexRanSplitProblem.
results_root = results_experiments

# Các artifact bổ sung; solution.csv luôn được lưu.
save_json = true
save_sol = false
