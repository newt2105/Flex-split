# Chỉ cần sửa file này để chọn các thí nghiệm PlaceRAN/PuLP.

[experiments]
# Chương trình chạy từ trên xuống dưới. Thêm dấu # ở đầu dòng để bỏ case.
cases =
    ; T1-R1-LC
    ; T1-R1-RC
    ; T1-R1-HC
    ; T1-F1-LC
    ; T1-F1-RC
    ; T1-F1-HC
    ; T2-R1-LC
    ; T2-R1-RC
    ; T2-R1-HC
    ; T2-F1-LC
    ; T2-F1-RC
    T2-F1-HC

# Số đường vật lý tối đa được sinh cho mỗi vị trí RU.
k_paths = 2

# PuLP backend: cbc, gurobi hoặc auto.
solver = gurobi
solver_log = true

# Để trống nếu không giới hạn; nếu đặt thì tính bằng giây cho mỗi stage.
time_limit =

# Dừng ngay nếu một case lỗi. false = ghi lỗi và chạy case tiếp theo.
stop_on_error = true

# Đường dẫn tương đối được tính từ thư mục PlaceRAN.
results_root = results_pulp
